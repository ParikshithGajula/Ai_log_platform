server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Backend proxy (optional: set BACKEND_UPSTREAM at runtime via envsubst
    # if you wire docker-compose to proxy /api -> backend:8000)
}
