services:
  mongodb:
    image: mongo:7
    ports: [ "27017:27017" ]
    volumes: [ mongo_data:/data/db ]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
    # (explain: named volume keeps data between restarts)

  redis:
    image: redis:7-alpine
    ports: [ "6379:6379" ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports: [ "8000:8000" ]
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: ./backend/.env.docker
    # (explain: backend waits for healthy mongo + redis before starting)

  worker:
    build: ./backend
    command: celery -A celery_worker worker --loglevel=info
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      backend: { condition: service_started }
    env_file: ./backend/.env.docker
    # (explain: same image as backend but runs
    #  celery instead of uvicorn)

  frontend:
    build:
      context: ./frontend
      args:
        # Vite bakes the API URL at build time — override for prod:
        # docker compose build --build-arg VITE_API_URL=https://your-backend.onrender.com
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
        - VITE_BASE_PATH=${VITE_BASE_PATH:-/}
    ports: [ "3000:80" ]
    depends_on: [ backend ]

volumes:
  mongo_data:
